description: "Parse one row of a CSV or tabular file into typed workflow parameters."
long_description: "Generic expression tool that turns selected columns of a single table row into float, integer, text or boolean workflow parameters, so a table of parameter sets can drive a workflow. The number of outputs is a fixed pool of slots pruned with output filters."
